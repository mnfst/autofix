version: 2

# Grouped and monthly. The Node package has zero runtime dependencies and
# Python has one, so almost everything here is dev tooling and a PR per bump
# would be noise.
updates:
  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: monthly
    groups:
      node-dev:
        patterns: ['*']
    ignore:
      # typescript-eslint's peer range caps at typescript <6.1.0; TS 6/7
      # bumps break npm install until it catches up. Bump manually then.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: monthly
    groups:
      python-dev:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
